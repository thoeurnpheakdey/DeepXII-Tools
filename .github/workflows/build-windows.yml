name: Build Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q main.py config.py core ui

      - name: Build standalone Windows executable
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm build_windows_onefile.spec

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "dist\DeepXIITools.exe").Hash.ToLower()
          "$hash  DeepXIITools.exe" | Set-Content -Encoding ascii "dist\DeepXIITools.exe.sha256"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DeepXIITools-Windows
          path: |
            dist/DeepXIITools.exe
            dist/DeepXIITools.exe.sha256
          if-no-files-found: error
